services:
  # ── MySQL Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: automateqa
      MYSQL_DATABASE: automateqa
    ports:
      - "3366:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible local storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create the S3 bucket on startup
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/automateqa-tests &&
        echo 'Bucket automateqa-tests is ready'
      "

  # ── FastAPI Backend ─────────────────────────────────────────────
  # Source code (engine/ server/) is mounted from the host so Python changes
  # are reflected immediately — no image rebuild needed.
  # AQA_RELOAD defaults to true so uvicorn watches for file changes.
  # Override in .env: AQA_RELOAD=false  AQA_WORKERS=4  (for production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./engine:/app/engine
      - ./server:/app/server
      - ./cli.py:/app/cli.py
    environment:
      # Database
      AQA_DB_HOST: mysql
      AQA_DB_PORT: "3306"
      AQA_DB_USER: root
      AQA_DB_PASSWORD: automateqa
      AQA_DB_NAME: automateqa

      # S3 (MinIO)
      AQA_S3_BUCKET: automateqa-tests
      AQA_S3_REGION: us-east-1
      AQA_S3_ACCESS_KEY: minioadmin
      AQA_S3_SECRET_KEY: minioadmin
      AQA_S3_ENDPOINT_URL: http://minio:9000

      # CORS (allow frontend container)
      AQA_CORS_ORIGINS: http://localhost,http://localhost:3000,http://localhost:5173

      # LLM (optional — set your keys to enable healing)
      AQA_LLM_PROVIDER: openai
      AQA_LLM_MODEL: gpt-4o
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Browser (always headless in container)
      AQA_HEADLESS: "true"
      AQA_BROWSER: chromium

      # Server — AQA_RELOAD=true enables uvicorn --reload (forces workers=1)
      AQA_RELOAD: "${AQA_RELOAD:-true}"
      AQA_WORKERS: "${AQA_WORKERS:-1}"
      AQA_LOG_LEVEL: "${AQA_LOG_LEVEL:-info}"
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: .env
        required: false

  # ── React Frontend (nginx) ──────────────────────────────────────
  # After any frontend change run `cd dashboard && npm run build`
  # then `docker-compose restart frontend` — the volume mount picks it up
  # without rebuilding the image.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html:ro

volumes:
  mysql_data:
  minio_data:
